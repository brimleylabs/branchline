<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;padding:0;background:#0b1526}
  .banner{position:relative;width:1544px;height:500px;overflow:hidden;background:
    radial-gradient(1200px 600px at 85% 50%, #142a4a 0%, #0b1526 60%);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f3f6fb}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
  .text{position:absolute;left:96px;top:118px;width:620px}
  .mark{display:flex;align-items:center;gap:18px}
  .mark svg{width:72px;height:72px}
  .name{font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .tag{margin-top:26px;font-size:28px;font-weight:500;line-height:1.3;color:#c9d4e5}
  .sub{margin-top:18px;font-size:19px;font-weight:500;color:#8fa3c2}
  .art{position:absolute;right:70px;top:0;width:760px;height:500px}
</style></head><body>
<div class="banner">
  <div class="grid"></div>
  <div class="text">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 12v40" stroke="#f3f6fb" stroke-width="5"/>
        <path d="M18 24c0 12 28 8 28 20" stroke="#f59e0b" stroke-width="5"/>
        <circle cx="18" cy="12" r="6" fill="#0b1526" stroke="#f3f6fb" stroke-width="4"/>
        <circle cx="18" cy="52" r="6" fill="#0b1526" stroke="#f3f6fb" stroke-width="4"/>
        <circle cx="46" cy="44" r="6" fill="#0b1526" stroke="#f59e0b" stroke-width="4"/>
      </svg>
      <div class="name">Branchline</div>
    </div>
    <div class="tag">Version control for the WordPress database.</div>
    <div class="sub">Every environment is a branch. Pull content down, publish releases up, lose nothing.</div>
  </div>
  <svg class="art" viewBox="0 0 760 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- production line -->
    <path d="M40 330 H720" stroke="#3e5a85" stroke-width="6"/>
    <!-- release branch: splits, runs, merges back -->
    <path d="M190 330 C 250 330, 250 170, 320 170 H 500 C 570 170, 570 330, 630 330" stroke="#f59e0b" stroke-width="6"/>
    <!-- pull: production content down into release -->
    <path d="M400 330 C 400 280, 420 230, 440 180" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="2 10"/>
    <!-- commits on production -->
    <g fill="#0b1526" stroke="#8fa3c2" stroke-width="4">
      <circle cx="110" cy="330" r="9"/><circle cx="190" cy="330" r="9"/><circle cx="290" cy="330" r="9"/>
      <circle cx="400" cy="330" r="9"/><circle cx="520" cy="330" r="9"/><circle cx="630" cy="330" r="9"/>
    </g>
    <!-- commits on release -->
    <g fill="#0b1526" stroke="#f59e0b" stroke-width="4">
      <circle cx="340" cy="170" r="9"/><circle cx="440" cy="170" r="9"/><circle cx="500" cy="170" r="9"/>
    </g>
    <!-- merge node -->
    <circle cx="630" cy="330" r="14" fill="#f59e0b" stroke="#0b1526" stroke-width="4"/>
    <!-- labels -->
    <g font-family="Inter,system-ui,sans-serif" font-weight="600" fill="#c9d4e5" font-size="18">
      <text x="300" y="140">release</text>
      <text x="40" y="372">production</text>
      <text x="448" y="262" fill="#2dd4bf">pull</text>
      <text x="570" y="402" fill="#f59e0b">publish</text>
    </g>
    <g font-family="Inter,system-ui,sans-serif" font-weight="500" fill="#8fa3c2" font-size="15">
      <text x="88" y="300">posts</text><text x="262" y="300">orders</text><text x="486" y="300">comments</text>
      <text x="322" y="212">pages</text><text x="414" y="212">menus</text><text x="482" y="212">settings</text>
    </g>
  </svg>
</div>
</body></html>
